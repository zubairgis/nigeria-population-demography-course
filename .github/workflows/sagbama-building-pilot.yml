name: Sagbama building pilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sagbama-building-pilot.yml"
  workflow_dispatch:

jobs:
  building-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas geopandas pyogrio shapely pyproj requests pyarrow fiona s2sphere

      - name: Run real Sagbama Google Open Buildings pilot
        run: python scripts/10_run_sagbama_building_pilot.py

      - name: Upload validation summaries only
        uses: actions/upload-artifact@v4
        with:
          name: sagbama-building-pilot-summary
          path: checks/building_pilot_output/
          if-no-files-found: error
          retention-days: 7
