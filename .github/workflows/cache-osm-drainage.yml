name: Cache Nigeria OSM drainage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cache-osm-drainage.yml"
      - "scripts/12_cache_osm_drainage.py"

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install osmium and Python GIS tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          python -m pip install --upgrade pip
          python -m pip install geopandas pyogrio shapely pandas

      - name: Build state drainage cache
        run: python scripts/12_cache_osm_drainage.py

      - name: Commit drainage cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drainage
          if git diff --cached --quiet; then
            echo "No drainage changes."
          else
            git commit -m "Cache Nigeria OSM drainage by state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
